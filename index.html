<div id="control-wheel" style="display: none;">
    <div class="cockpit-view">
        <div class="volante-wrapper">
            <img src="https://i.imgur.com/v6S7vS8.png" id="volante-img" class="volante-img" alt="Volante">
        </div>
        
        <div class="pedales-container">
            <div class="pedal brake" ontouchstart="send('B')" ontouchend="send('S')">
                <div class="pedal-texture">BRAKE</div>
            </div>
            <div class="pedal gas" ontouchstart="send('F')" ontouchend="send('S')">
                <div class="pedal-texture">GAS</div>
            </div>
        </div>

        <div class="shifter">
            <div class="knob"></div>
            <span>R N D</span>
        </div>
    </div>
</div>
