<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Car Control</title>
    <link rel="stylesheet" href="index.css" />
</head>
<body>

    <header>
        <h1>Control Gemini 🏎️</h1>
        <button class="btn-connect" onclick="connectBT()">CONECTAR CARRO</button>
        <p id="status">Estado: Desconectado</p>
    </header>

    <div class="mode-selector">
        <button onclick="switchMode('arrows')">Flechas</button>
        <button onclick="switchMode('wheel')">Volante</button>
    </div>

    <div id="control-arrows">
        <div class="btn-control" style="grid-area: up" ontouchstart="send('F')" ontouchend="send('S')">▲</div>
        <div class="btn-control" style="grid-area: left" ontouchstart="send('L')" ontouchend="send('S')">◀</div>
        <div class="btn-control" style="grid-area: stop" onclick="send('S')">⏹️</div>
        <div class="btn-control" style="grid-area: right" ontouchstart="send('R')" ontouchend="send('S')">▶</div>
        <div class="btn-control" style="grid-area: down" ontouchstart="send('B')" ontouchend="send('S')">▼</div>
    </div>

    <div id="control-wheel">
        <div class="volante-container" id="volante">
            <div style="width: 80%; height: 20px; background: silver; border-radius: 10px;"></div>
        </div>
        
        <div class="pedales-container">
            <div class="pedal" style="color: var(--neon-red);" ontouchstart="send('B')" ontouchend="send('S')">FRENO</div>
            <div class="pedal" style="color: #44ff44;" ontouchstart="send('F')" ontouchend="send('S')">GAS</div>
        </div>

        <div class="palanca">
            P<br>R<br>N<br>D
        </div>
    </div>

   
   <script src="index.js"></script>


</body>
</html>
