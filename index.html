<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Pro Control - Volante y Pedales</title>
    
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div id="control-wheel">
        <div class="cockpit-view">
            
            <div class="volante-wrapper" id="volante">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcREBjCML-B4pVogTrC8Rt4336ijk7_b2eOQ5A&s" 
                     id="volante-img" 
                     class="volante-img" 
                     alt="Volante">
            </div>
            
            <div class="pedales-container">
                <div class="pedal brake" ontouchstart="send('B')" ontouchend="send('S')">
                    <div class="pedal-label">BRAKE</div>
                </div>
                
                <div class="pedal gas" ontouchstart="send('F')" ontouchend="send('S')">
                    <div class="pedal-label">GAS</div>
                </div>
            </div>

            <div class="shifter">
                <div class="knob"></div>
                <div class="gear-indicator">
                    <span>R</span>
                    <span>N</span>
                    <span class="active-gear">D</span>
                </div>
            </div>

        </div>
    </div>

    <script src="index.js"></script>

</body>
</html>
